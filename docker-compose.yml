version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: risk_assessment_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-${DB_PASSWORD}}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: risk_assessment_backend
    environment:
      - PORT=5001
      - DB_SERVER=sqlserver
      - DB_PORT=1433
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-IT_Apps}
      - DB_ENCRYPT=false
      - DB_TRUST_SERVER_CERT=true
    ports:
      - "5001:5001"
    depends_on:
      - sqlserver
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: risk_assessment_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  mssql_data:
